name: Concurrency stress test

# Race conditions are intermittent: one green run proves little.
# This repeats the concurrency tests many times to flush them out.
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      iterations:
        description: "How many times to repeat the tests"
        required: false
        default: "25"

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Repeat concurrency tests
        env:
          ITERATIONS: ${{ inputs.iterations || '25' }}
        run: |
          for i in $(seq 1 "$ITERATIONS"); do
            echo "::group::Iteration $i of $ITERATIONS"
            mvn --batch-mode --no-transfer-progress -q test \
              -Dtest='InventoryTest,TrolleyPoolTest,SimulationRunTest' \
              || { echo "::error::Failed on iteration $i"; exit 1; }
            echo "::endgroup::"
          done

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stress-surefire-reports
          path: target/surefire-reports/
          retention-days: 14
